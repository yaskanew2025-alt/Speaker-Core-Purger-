name: Build Speaker Core Purger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project zip
        run: |
          ZIP="$(ls ./*.zip | head -n 1)"
          echo "Unpacking $ZIP"
          unzip -q "$ZIP"
          ls SpeakerCorePurger

      - name: Build debug and release APKs
        working-directory: SpeakerCorePurger
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_APP_BANNER }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_APP_INTERSTITIAL }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_APP_REWARDED_INTERSTITIAL }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Publish APKs on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SpeakerCorePurger/app/build/outputs/apk/debug/app-debug.apk SpeakerCorePurger-debug.apk
          cp SpeakerCorePurger/app/build/outputs/apk/release/app-release.apk SpeakerCorePurger-release.apk
          gh release create "build-${{ github.run_number }}" \
            SpeakerCorePurger-debug.apk SpeakerCorePurger-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "Speaker Core Purger build ${{ github.run_number }}" \
            --notes "Tap SpeakerCorePurger-debug.apk to download it, then install it."

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakerCorePurger-apks
          path: SpeakerCorePurger/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
